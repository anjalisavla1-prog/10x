<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome, Anjali!</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #243047;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #d9f8df, #b8e6c1);
    }

    main {
      width: min(100%, 600px);
      padding: 56px 36px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(51, 65, 100, 0.15);
    }

    .sparkle {
      margin: 0 0 16px;
      font-size: 42px;
    }

    h1 {
      margin: 0;
      color: #6941a5;
      font-size: clamp(2.5rem, 8vw, 4rem);
    }

    p {
      margin: 18px 0 0;
      color: #5c667a;
      font-size: 1.1rem;
      line-height: 1.6;
    }

  </style>
</head>
<body>
  <main>
    <div class="sparkle" aria-hidden="true">&#10024;</div>
    <h1>Welcome, Anjali!</h1>
    <p>So glad you're here. This is your little corner of the web. Make yourself at home!</p>
  </main>
</body>
</html>
